---
name: "Pull Request Triage"

permissions:
  pull-requests: write
  issues: write

on: [pull_request_target]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CodelyTV/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          xs_label: 'size/XS'
          xs_max_size: '30'
          s_label: 'size/S'
          s_max_size: '60'
          m_label: 'size/M'
          m_max_size: '150'
          l_label: 'size/L'
          l_max_size: '300'
          xl_label: 'size/XL'
          message_if_xl: ''
